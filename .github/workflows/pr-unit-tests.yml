name: Run Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
      LEIA_RUNTIME: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025
        runtime: [source, esm, cjs]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Node entrypoints
        if: matrix.runtime != 'source'
        run: bun run build
      - name: Enforce execution target isolation
        shell: bash
        run: |
          if [[ "$LEIA_RUNTIME" == source ]]; then
            test ! -e dist
          else
            node -e "const fs = require('node:fs'); for (const directory of ['bin', 'lib', 'utils', 'dist/' + (process.env.LEIA_RUNTIME === 'esm' ? 'cjs' : 'esm')]) fs.rmSync(directory, {recursive: true, force: true})"
          fi
      - name: Run shared application unit tests
        if: matrix.os != 'ubuntu-24.04' || matrix.runtime != 'esm'
        run: bun run test:app
      - name: Run shared application unit tests with TypeScript coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.runtime == 'esm'
        run: bun run test:coverage
      - name: Upload TypeScript coverage reports
        if: matrix.os == 'ubuntu-24.04' && matrix.runtime == 'esm'
        uses: actions/upload-artifact@v7
        with:
          name: typescript-unit-coverage
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/lcov-report/
          if-no-files-found: error
          retention-days: 14
      - name: Run tooling unit tests
        if: matrix.runtime == 'source'
        run: bun run test:tooling
