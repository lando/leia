name: Run Unit Tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025
    steps:
      # Install deps and cache
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from package.json
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run unit tests
      - name: Run units tests
        run: bun run test
      - name: Verify repeatable builds and watch mode
        run: bun run check:build
