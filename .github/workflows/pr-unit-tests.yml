name: Run Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Enforce source execution isolation
        shell: bash
        run: test ! -e dist
      - name: Run shared application unit tests
        run: bun run test:app
      - name: Run development helper unit tests
        run: bun run test:dev
