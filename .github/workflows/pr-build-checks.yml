name: Check Development Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-checks:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify repeatable builds, CLI parity, and isolated watch mode
        run: bun run check:build --scenarios

      - name: Run ESM application unit tests with TypeScript coverage
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          LEIA_RUNTIME: esm
        run: |
          bun run build
          node -e "const fs = require('node:fs'); for (const directory of ['bin', 'lib', 'utils', 'dist/cjs']) fs.rmSync(directory, {recursive: true, force: true})"
          bun run test:coverage
      - name: Upload TypeScript coverage reports
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: typescript-unit-coverage
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/lcov-report/
          if-no-files-found: error
          retention-days: 14
      - name: Run CommonJS application unit tests
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          LEIA_RUNTIME: cjs
        run: |
          git restore bin lib utils
          bun run build
          node -e "const fs = require('node:fs'); for (const directory of ['bin', 'lib', 'utils', 'dist/esm']) fs.rmSync(directory, {recursive: true, force: true})"
          bun run test:app
          git restore bin lib utils

      - name: Build and verify the installed npm tarball
        run: |
          bun run build
          bun run check:package --scenarios
