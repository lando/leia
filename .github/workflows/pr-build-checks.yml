name: Check Development Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-checks:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify repeatable builds, CLI parity, and isolated watch mode
        run: bun run check:build --scenarios

      - name: Build and verify the installed npm tarball
        run: |
          bun run build
          bun run check:package --scenarios
