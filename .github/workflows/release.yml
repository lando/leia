name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  release-npm:
    name: Publish npm package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: https://registry.npmjs.org
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run check:build --scenarios
      - name: Export formatted release date
        shell: bash
        env:
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: echo "RELEASE_DATE=$(date -d "$PUBLISHED_AT" "+%B %e, %Y" | tr -s ' ')" >> "$GITHUB_ENV"
      - name: Prepare release
        uses: tanaabased/prepare-release-action@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
          sync: true
          version: ${{ github.event.release.tag_name }}
          sync-token: ${{ secrets.RTFM47_COAXIUM_INJECTOR }}
          sync-email: rtfm47@lando.dev
          sync-username: rtfm-47
          sync-verified: true
          update-files: CHANGELOG.md
          update-files-header: |
            ## {{ UNRELEASED_VERSION }} - [{{ UNRELEASED_DATE }}]({{ UNRELEASED_LINK }})
          update-files-meta: |
            UNRELEASED_DATE=${{ env.RELEASE_DATE }}
            UNRELEASED_LINK=${{ github.event.release.html_url }}
            UNRELEASED_VERSION=${{ github.event.release.tag_name }}
      # The action stamps files after its commands; validate those mutations too.
      - name: Build prepared package entrypoints
        run: bun run build
      - name: Check prepared package formatting
        run: bun run format:check
      - name: Verify the prepared tarball in isolated consumers
        run: bun run check:package --scenarios --pack-destination=.temp/package
      - name: Upgrade npm for trusted publishing
        run: npm install --global "npm@^11.5.1"
      - name: Publish stable package with trusted publishing
        if: github.event.release.prerelease == false
        run: |
          npm publish .temp/package/*.tgz --access public --tag latest --dry-run
          npm publish .temp/package/*.tgz --access public --tag latest
      - name: Publish prerelease package with trusted publishing
        if: github.event.release.prerelease == true
        run: |
          npm publish .temp/package/*.tgz --access public --tag edge --dry-run
          npm publish .temp/package/*.tgz --access public --tag edge
      - name: Synchronize edge to the stable release
        if: github.event.release.prerelease == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DEPLOY_TOKEN }}
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add "$PACKAGE@$VERSION" edge
