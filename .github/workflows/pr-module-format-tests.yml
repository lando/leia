name: Run Module Format Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  module-format-tests:
    name: module-format-tests (${{ matrix.format }})
    runs-on: ubuntu-24.04
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        format:
          - commonjs
          - esm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test module format CLI contract
        shell: bash
        run: |
          bun run leia --help | grep -- '--module-format=auto|commonjs|esm'
          if bun run leia examples/basic-example.md --module-format amd; then
            echo 'Leia accepted an unsupported module format'
            exit 1
          fi

      - name: Run Leia examples
        shell: bash
        env:
          MODULE_FORMAT: ${{ matrix.format }}
        run: |
          bun run leia examples/basic-example.md --module-format "$MODULE_FORMAT"
          bun run leia "examples/**/*.md" -i "examples/basic-cmd-example.md" -i "examples/exclude-example/**/*.md" -i "examples/stdin-example.md" -i "examples/custom-headers.md" -i "examples/environment.md" -i "examples/basic-pwsh-example.md" --module-format "$MODULE_FORMAT"
          bun run leia examples/custom-headers.md -s Hello -t Sup -c Goodbye --module-format "$MODULE_FORMAT"
          bun run leia examples/basic-example.md --retry 2 --split-file --stdin --spawn --module-format "$MODULE_FORMAT"
          bun run leia examples/custom-headers.md -s Blue,No,Yellow,Hello -t Sup -c Goodbye --module-format "$MODULE_FORMAT"
          bun run leia examples/environment.md examples/basic-example.md --retry 4 --timeout 5 --module-format "$MODULE_FORMAT"
          bun run leia examples/basic-example.md --module-format "$MODULE_FORMAT" --shell bash
          bun run leia examples/basic-example.md --module-format "$MODULE_FORMAT" --shell sh

      - name: Test explicit package-scope overrides
        shell: bash
        env:
          MODULE_FORMAT: ${{ matrix.format }}
        run: bash examples/format-examples/run.sh "$MODULE_FORMAT"
