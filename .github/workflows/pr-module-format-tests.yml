name: Run Module Format Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  module-format-tests:
    name: module-format-tests (${{ matrix.format }}, ${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    env:
      TERM: xterm
      LEIA_RUNTIME: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        format:
          - commonjs
          - esm
        runtime:
          - source
          - esm
          - cjs
        include:
          - runtime: source
            cli: bun bin/leia.ts
          - runtime: esm
            cli: node dist/esm/bin/leia.js
          - runtime: cjs
            cli: node dist/cjs/bin/leia.cjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Node entrypoints
        if: matrix.runtime != 'source'
        run: bun run build
      - name: Enforce execution target isolation
        shell: bash
        run: |
          if [[ "$LEIA_RUNTIME" == source ]]; then
            test ! -e dist
          else
            node -e "const fs = require('node:fs'); for (const directory of ['bin', 'lib', 'utils', 'dist/' + (process.env.LEIA_RUNTIME === 'esm' ? 'cjs' : 'esm')]) fs.rmSync(directory, {recursive: true, force: true})"
          fi

      - name: Test module format CLI contract
        shell: bash
        run: |
          ${{ matrix.cli }} --help | grep -E -- '^[[:space:]]+--module-format[[:space:]]'
          if ${{ matrix.cli }} examples/basic-example.md --module-format amd; then
            echo 'Leia accepted an unsupported module format'
            exit 1
          fi

      - name: Test explicit package-scope overrides
        shell: bash
        env:
          MODULE_FORMAT: ${{ matrix.format }}
        run: bash examples/format-examples/run.sh "$MODULE_FORMAT"
