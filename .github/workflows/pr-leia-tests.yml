name: Run Leia Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  leia-tests:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
      LEIA_RUNTIME: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025
        runtime: [source, built]
        include:
          - runtime: source
            cli: bun bin/leia.ts
          - runtime: built
            cli: node dist/bin/leia.js

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Node entrypoints
        run: bun run build

      # Run a few iterations of leia tests
      - name: Run Leia tests
        shell: bash
        run: |
          # Try a basic example
          ${{ matrix.cli }} examples/basic-example.md --debug
          # Try globs and ignores
          ${{ matrix.cli }} "examples/**/*.md" -i "examples/basic-cmd-example.md" -i "examples/exclude-example/**/*.md" -i "examples/stdin-example.md" -i "examples/custom-headers.md" -i "examples/environment.md" -i "examples/basic-pwsh-example.md"
          # Try custom headers
          ${{ matrix.cli }} examples/custom-headers.md -s Hello -t Sup -c Goodbye
          # Try all other options, including legacy ones
          ${{ matrix.cli }} examples/basic-example.md --retry 2 --split-file --stdin --spawn
          # Try a comma separated list of headers
          ${{ matrix.cli }} examples/custom-headers.md -s Blue,No,Yellow,Hello -t Sup -c Goodbye
          # Assess envvars
          ${{ matrix.cli }} examples/environment.md examples/basic-example.md --retry 4 --timeout 5 --debug

      # Run auto detection from each package scope with a repository-local temporary directory
      - name: Test automatic module format detection
        shell: bash
        run: bash examples/format-examples/run.sh auto
