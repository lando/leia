name: Release tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-tests:
    name: release-tests (${{ matrix.version_type }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - release_version: v9.9.9
            version_type: stable-version
            dist_tag: latest
          - release_version: v9.9.9-ci.${{ github.event.pull_request.head.sha }}
            version_type: prerelease-version
            dist_tag: edge
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: https://registry.npmjs.org
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare synthetic release
        uses: ./.github/actions/prepare-release
        with:
          version: ${{ matrix.release_version }}
          published-at: '2000-01-01T00:00:00Z'
          release-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ matrix.release_version }}
      - name: Build prepared package entrypoints
        run: bun run build
      - name: Check prepared package formatting
        run: bun run format:check
      - name: Verify the prepared tarball in isolated consumers
        run: bun run check:package --scenarios --pack-destination=.temp/package
      - name: Validate the release channel without publishing
        env:
          NPM_DIST_TAG: ${{ matrix.dist_tag }}
        run: |
          npm install --global "npm@^11.5.1"
          npm publish .temp/package/*.tgz --access public --tag "$NPM_DIST_TAG" --dry-run
