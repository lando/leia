name: Lint Code

on:
  pull_request:

permissions:
  contents: read

jobs:
  linter:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      matrix:
        os:
          - ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Lint Code
      - name: Lint code
        run: bun run lint
      - name: Typecheck source and tooling
        run: bun run typecheck
