name: Run Shell Tests

on:
  pull_request:

jobs:
  shell-tests:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025

    steps:
      # Install deps and cache
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from package.json
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run a few iterations of leia tests
      - name: Test macOS shells from
        if: ${{ runner.os == 'macOS' }}
        run: |
          bun run leia examples/basic-example.md --shell bash --debug
          bun run leia examples/basic-example.md --shell zsh --debug
          bun run leia examples/basic-example.md --shell sh --debug
      - name: Test Linux shells
        if: ${{ runner.os == 'Linux' }}
        run: |
          bun run leia examples/basic-example.md --shell bash --debug
          bun run leia examples/basic-example.md --shell sh --debug
      - name: Test Windows BASH
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          bun run leia examples/basic-cmd-example.md --shell cmd --debug
          bun run leia examples/basic-pwsh-example.md --shell pwsh --debug
          bun run leia examples/basic-pwsh-example.md --shell powershell --debug
          bun run leia examples/basic-pwsh-example.md --shell powershell --stdin --debug
      - name: Test Windows SHELLS
        if: ${{ runner.os == 'Windows' }}
        run: |
          bun run leia examples/basic-cmd-example.md --shell cmd --debug
          bun run leia examples/basic-pwsh-example.md --shell pwsh --debug
          bun run leia examples/basic-pwsh-example.md --shell powershell --debug
          bun run leia examples/basic-pwsh-example.md --shell powershell --stdin --debug
