name: Run Shell Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Enforce source execution isolation
        shell: bash
        run: test ! -e dist

      # run a few iterations of leia tests
      - name: Test macOS shells from
        if: ${{ runner.os == 'macOS' }}
        run: |
          bun bin/leia.ts examples/basic-example.md --shell bash --debug
          bun bin/leia.ts examples/basic-example.md --shell zsh --debug
          bun bin/leia.ts examples/basic-example.md --shell sh --debug
      - name: Test Linux shells
        if: ${{ runner.os == 'Linux' }}
        run: |
          bun bin/leia.ts examples/basic-example.md --shell bash --debug
          bun bin/leia.ts examples/basic-example.md --shell sh --debug
      - name: Test Windows BASH
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          bun bin/leia.ts examples/basic-cmd-example.md --shell cmd --debug
          bun bin/leia.ts examples/basic-pwsh-example.md --shell pwsh --debug
          bun bin/leia.ts examples/basic-pwsh-example.md --shell powershell --debug
          bun bin/leia.ts examples/basic-pwsh-example.md --shell powershell --stdin --debug
      - name: Test Windows SHELLS
        if: ${{ runner.os == 'Windows' }}
        run: |
          bun bin/leia.ts examples/basic-cmd-example.md --shell cmd --debug
          bun bin/leia.ts examples/basic-pwsh-example.md --shell pwsh --debug
          bun bin/leia.ts examples/basic-pwsh-example.md --shell powershell --debug
          bun bin/leia.ts examples/basic-pwsh-example.md --shell powershell --stdin --debug
