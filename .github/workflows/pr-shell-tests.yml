name: Run Shell Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
      LEIA_RUNTIME: ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - windows-2025
        runtime:
          - source
          - esm
          - cjs
        include:
          - runtime: source
            cli: bun bin/leia.ts
          - runtime: esm
            cli: node dist/esm/bin/leia.js
          - runtime: cjs
            cli: node dist/cjs/bin/leia.cjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Node from .node-version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - name: Install Bun from .bun-version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check Bun version
        run: bun run check:toolchain
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Node entrypoints
        if: matrix.runtime != 'source'
        run: bun run build
      - name: Enforce execution target isolation
        shell: bash
        run: |
          if [[ "$LEIA_RUNTIME" == source ]]; then
            test ! -e dist
          else
            node -e "const fs = require('node:fs'); for (const directory of ['bin', 'lib', 'utils', 'dist/' + (process.env.LEIA_RUNTIME === 'esm' ? 'cjs' : 'esm')]) fs.rmSync(directory, {recursive: true, force: true})"
          fi

      # run a few iterations of leia tests
      - name: Test macOS shells from
        if: ${{ runner.os == 'macOS' }}
        run: |
          ${{ matrix.cli }} examples/basic-example.md --shell bash --debug
          ${{ matrix.cli }} examples/basic-example.md --shell zsh --debug
          ${{ matrix.cli }} examples/basic-example.md --shell sh --debug
      - name: Test Linux shells
        if: ${{ runner.os == 'Linux' }}
        run: |
          ${{ matrix.cli }} examples/basic-example.md --shell bash --debug
          ${{ matrix.cli }} examples/basic-example.md --shell sh --debug
      - name: Test Windows BASH
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          ${{ matrix.cli }} examples/basic-cmd-example.md --shell cmd --debug
          ${{ matrix.cli }} examples/basic-pwsh-example.md --shell pwsh --debug
          ${{ matrix.cli }} examples/basic-pwsh-example.md --shell powershell --debug
          ${{ matrix.cli }} examples/basic-pwsh-example.md --shell powershell --stdin --debug
      - name: Test Windows SHELLS
        if: ${{ runner.os == 'Windows' }}
        run: |
          ${{ matrix.cli }} examples/basic-cmd-example.md --shell cmd --debug
          ${{ matrix.cli }} examples/basic-pwsh-example.md --shell pwsh --debug
          ${{ matrix.cli }} examples/basic-pwsh-example.md --shell powershell --debug
          ${{ matrix.cli }} examples/basic-pwsh-example.md --shell powershell --stdin --debug
