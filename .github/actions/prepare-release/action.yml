name: Prepare Leia release
description: Stamp Leia's package, plugin, and changelog, optionally syncing the release to Git.

inputs:
  version:
    description: Release tag to prepare.
    default: ${{ github.event.release.tag_name }}
  published-at:
    description: Release timestamp used for the changelog date.
    default: ${{ github.event.release.published_at }}
  release-url:
    description: Release link used in the changelog.
    default: ${{ github.event.release.html_url }}
  sync:
    description: Publish prepared changes and tags back to the repository.
    default: 'false'
  sync-branch:
    description: Branch receiving prepared release changes.
    default: ${{ github.event.release.target_commitish || github.ref_name }}
  sync-token:
    description: GitHub credential for repository publication when sync is enabled.
    default: ${{ github.token }}

outputs:
  resolved-version:
    description: Version resolved by Prepare Release Action.
    value: ${{ steps.prepare.outputs.resolved-version }}

runs:
  using: composite
  steps:
    - name: Format release date
      id: date
      shell: bash
      env:
        PUBLISHED_AT: ${{ inputs.published-at }}
      run: echo "value=$(date -d "$PUBLISHED_AT" "+%B %e, %Y" | tr -s ' ')" >> "$GITHUB_OUTPUT"
    - name: Prepare release
      id: prepare
      uses: tanaabased/prepare-release-action@v1
      with:
        commands: |
          version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
          bun run format:write
        version: ${{ inputs.version }}
        sync: ${{ inputs.sync }}
        sync-branch: ${{ inputs.sync-branch }}
        sync-token: ${{ inputs.sync-token }}
        sync-email: rtfm47@lando.dev
        sync-username: rtfm-47
        sync-verified: ${{ inputs.sync == 'true' }}
        update-files: CHANGELOG.md
        update-files-header: |
          ## {{ UNRELEASED_VERSION }} - [{{ UNRELEASED_DATE }}]({{ UNRELEASED_LINK }})
        update-files-meta: |
          UNRELEASED_DATE=${{ steps.date.outputs.value }}
          UNRELEASED_LINK=${{ inputs.release-url }}
          UNRELEASED_VERSION=${{ inputs.version }}
